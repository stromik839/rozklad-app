plugins {
    id 'com.android.application'
}

// Номер збірки з GitHub Actions — щоб кожна нова версія ставилась поверх попередньої.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

// Ключ підпису. Якщо GitHub Actions дав власний секретний ключ (див. README, «Свій ключ підпису») —
// підписуємо ним. Інакше — старим ключем із репозиторію, як і раніше.
def ownKeystore = System.getenv('ROZKLAD_KEYSTORE') ?: ''
def useOwnKey = !ownKeystore.isEmpty() && new File(ownKeystore).exists()
def keyPass = useOwnKey ? (System.getenv('ROZKLAD_KEYSTORE_PASSWORD') ?: '') : 'rozklad2026'
if (useOwnKey && keyPass.isEmpty()) {
    throw new GradleException('Немає пароля ключа підпису: додайте секрет ROZKLAD_KEYSTORE_PASSWORD.')
}

android {
    namespace 'ua.school.rozklad'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.school.rozklad'
        minSdk 21
        targetSdk 35
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // Один ключ для всіх збірок: інакше оновлення не встановиться поверх старої версії.
    signingConfigs {
        shared {
            storeFile = useOwnKey ? new File(ownKeystore) : file('rozklad.p12')
            storePassword = keyPass
            keyAlias = 'rozklad'
            keyPassword = keyPass
            storeType = 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            // R8 стискає й перейменовує код — готовий застосунок важче вкрасти й прочитати.
            // Правила-винятки (міст зі сторінкою, компоненти маніфесту) — у app/proguard-rules.pro.
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
