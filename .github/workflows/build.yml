name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Спершу перевіряємо розклад: якщо в data.js помилка, збірка зупиниться і скаже, де саме.
      - name: Check schedule (data.js)
        run: node tools/check-data.js app/src/main/assets/data.js

      # Стискаємо код сторінки застосунку (robить його нечитабельним у готовому APK).
      # Чіпає лише копію для складання — файли в репозиторії лишаються звичайними.
      - name: Minify page code
        run: |
          npm install --no-save esbuild@0.28.2
          node tools/minify-assets.mjs .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Власний секретний ключ підпису, якщо його додано в секрети репозиторію (див. README).
      # Без нього застосунок підписується старим ключем, як і раніше.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ROZKLAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROZKLAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "Є секрет ROZKLAD_KEYSTORE_B64, але немає ROZKLAD_KEYSTORE_PASSWORD — додайте пароль ключа."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rozklad-release.p12"
            echo "ROZKLAD_KEYSTORE=$RUNNER_TEMP/rozklad-release.p12" >> "$GITHUB_ENV"
            echo "Підпис: власний секретний ключ."
          else
            echo "Підпис: старий ключ із репозиторію (секретів ROZKLAD_KEYSTORE_* немає)."
          fi

      - name: Build APK
        env:
          ROZKLAD_KEYSTORE_PASSWORD: ${{ secrets.ROZKLAD_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Rozklad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rozklad-apk
          path: Rozklad.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Розклад, збірка ${{ github.run_number }}
          files: Rozklad.apk
